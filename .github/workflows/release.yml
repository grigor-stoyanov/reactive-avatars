name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: reactive-avatars-linux
          - os: windows-latest
            name: reactive-avatars-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: PortAudio (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: >
          uv run --with pyinstaller pyinstaller --noconfirm --clean
          --distpath dist --workpath build/pyinstaller packaging/reactive-avatars.spec
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/reactive-avatars*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: |
          mv artifacts/reactive-avatars-linux/reactive-avatars reactive-avatars-linux
          mv artifacts/reactive-avatars-windows/reactive-avatars.exe reactive-avatars-windows.exe
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            reactive-avatars-linux
            reactive-avatars-windows.exe
