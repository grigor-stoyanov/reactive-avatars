[project]
name = "reactive-avatars"
version = "0.1.0"
description = "Mic-reactive avatar overlay for OBS/Streamlabs Browser Sources. Upload any image and it reacts to your voice."
license = "MIT"
license-files = ["LICENSE"]
keywords = ["obs", "streamlabs", "vtuber", "pngtuber", "overlay", "avatar"]
readme = "README.md"
authors = [
    { name = "grigor-stoyanov", email = "grigor.stoyanov@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "numpy>=2.5.4",
    "sounddevice>=0.5.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
reactive-avatars = "reactive_avatars:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
